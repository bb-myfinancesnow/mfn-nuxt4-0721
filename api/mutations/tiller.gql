mutation RunTillerSheetTrans(
	$abortOnFirstMissing: Boolean!
	$createPending: Boolean!
) {
	runTillerSheetTrans(
		abortOnFirstMissing: $abortOnFirstMissing
		createPending: $createPending
	) {
		createdCount
		missingCategories
		missingAccounts
		newTranCount
		pending {
			account
			category
			date
			dateAdded
			description
			transactionId
			amount
		}
	}
}

mutation CreateTillerGenImportJob($input: [GenerateTillerJournalInput!]!) {
	addTillerGenImportJob(input: $input) {
		id
		queue
		recordCount
	}
}
