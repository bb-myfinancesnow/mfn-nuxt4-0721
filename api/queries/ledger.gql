query QueryJournalFormInputs($periodWhere: PeriodWhereInput) {
	periods(orderBy: [{ year: asc }, { month: asc }], where: $periodWhere) {
		...PeriodRecord
	}
	glAccounts(orderBy: [{ accountNumber: asc }]) {
		...GlAccInfo
	}
	entities(orderBy: [{ id: asc }]) {
		...EntityInfo
	}
	books(orderBy: [{ id: asc }]) {
		...BookLedgerInfo
	}
}
